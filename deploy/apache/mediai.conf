<VirtualHost *:80>
    ServerName example.com
    DocumentRoot /var/www/mediai/public

    <Directory /var/www/mediai/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Redirect to HTTPS (if TLS configured)
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/mediai_error.log
    CustomLog ${APACHE_LOG_DIR}/mediai_access.log combined
</VirtualHost>
